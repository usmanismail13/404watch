<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>404Watch Alert</title>
</head>

<body style="
  margin: 0;
  padding: 0;
  background-color: #f4f4f5;
  font-family: Arial, Helvetica, sans-serif;
">

  <table
    width="100%"
    cellpadding="0"
    cellspacing="0"
    border="0"
    style="background-color: #f4f4f5;"
  >
    <tr>
      <td
        align="center"
        style="padding: 40px 20px;"
      >

        <table
          width="100%"
          cellpadding="0"
          cellspacing="0"
          border="0"
          style="
            max-width: 600px;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
          "
        >

          <!-- Header -->
          <tr>
            <td
              style="
                background-color: #111827;
                padding: 24px 30px;
              "
            >
              <h1
                style="
                  margin: 0;
                  color: #ffffff;
                  font-size: 24px;
                  line-height: 1.3;
                "
              >
                404Watch
              </h1>
            </td>
          </tr>

          <!-- Content -->
          <tr>
            <td style="padding: 30px;">

              <h2
                style="
                  margin: 0 0 20px;
                  color: #dc2626;
                  font-size: 22px;
                  line-height: 1.4;
                "
              >
                🚨 404 Error Detected
              </h2>

              <p
                style="
                  margin: 0 0 20px;
                  color: #374151;
                  font-size: 16px;
                  line-height: 1.6;
                "
              >
                404Watch detected a broken URL on your website.
              </p>

              <!-- Broken URL -->
              <table
                width="100%"
                cellpadding="0"
                cellspacing="0"
                border="0"
                style="
                  margin-bottom: 16px;
                  background-color: #fef2f2;
                  border-left: 4px solid #dc2626;
                "
              >
                <tr>
                  <td style="padding: 16px;">

                    <p
                      style="
                        margin: 0 0 6px;
                        color: #6b7280;
                        font-size: 13px;
                        font-weight: bold;
                      "
                    >
                      BROKEN URL
                    </p>

                    <p
                      style="
                        margin: 0;
                        font-size: 15px;
                        line-height: 1.5;
                        word-break: break-word;
                      "
                    >
                      <a
                        href="https://example.com/missing-page"
                        style="
                          color: #dc2626;
                          text-decoration: underline;
                        "
                      >
                        https://example.com/missing-page
                      </a>
                    </p>

                  </td>
                </tr>
              </table>

              <!-- Source Page -->
              <table
                width="100%"
                cellpadding="0"
                cellspacing="0"
                border="0"
                style="
                  margin-bottom: 16px;
                  background-color: #f9fafb;
                "
              >
                <tr>
                  <td style="padding: 16px;">

                    <p
                      style="
                        margin: 0 0 6px;
                        color: #6b7280;
                        font-size: 13px;
                        font-weight: bold;
                      "
                    >
                      SOURCE PAGE
                    </p>

                    <p
                      style="
                        margin: 0;
                        font-size: 15px;
                        line-height: 1.5;
                        word-break: break-word;
                      "
                    >
                      <a
                        href="https://example.com/blog"
                        style="
                          color: #2563eb;
                          text-decoration: underline;
                        "
                      >
                        https://example.com/blog
                      </a>
                    </p>

                  </td>
                </tr>
              </table>

              <!-- Detection Time -->
              <table
                width="100%"
                cellpadding="0"
                cellspacing="0"
                border="0"
                style="
                  margin-bottom: 24px;
                  background-color: #f9fafb;
                "
              >
                <tr>
                  <td style="padding: 16px;">

                    <p
                      style="
                        margin: 0 0 6px;
                        color: #6b7280;
                        font-size: 13px;
                        font-weight: bold;
                      "
                    >
                      DETECTED
                    </p>

                    <p
                      style="
                        margin: 0;
                        color: #111827;
                        font-size: 15px;
                      "
                    >
                      August 29, 2026
                    </p>

                  </td>
                </tr>
              </table>

              <!-- Button -->
              <table
                cellpadding="0"
                cellspacing="0"
                border="0"
              >
                <tr>
                  <td
                    style="
                      background-color: #dc2626;
                      border-radius: 6px;
                    "
                  >
                    <a
                      href="https://example.com"
                      style="
                        display: inline-block;
                        padding: 12px 20px;
                        color: #ffffff;
                        text-decoration: none;
                        font-size: 15px;
                        font-weight: bold;
                      "
                    >
                      View in 404Watch
                    </a>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td
              style="
                padding: 20px 30px;
                background-color: #f9fafb;
                border-top: 1px solid #e5e7eb;
              "
            >

              <p
                style="
                  margin: 0;
                  color: #6b7280;
                  font-size: 13px;
                  line-height: 1.5;
                "
              >
                This alert was sent by 404Watch.
              </p>

            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
